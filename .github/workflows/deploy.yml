name: Deploy

# main에 푸시되면 빌드하고, GitHub Pages로 배포한다.
# 수동 실행(workflow_dispatch)도 열어둔다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포에 필요한 최소 권한만.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다(중간에 끊긴 배포가
# 사이트를 깨진 상태로 남기지 않도록).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # 프로젝트 사이트는 https://<user>.github.io/<repo>/ 아래에 놓이므로
        # base 경로를 레포명으로 맞춰야 에셋 링크가 깨지지 않는다.
        # 루트 도메인이나 자가호스팅으로 옮기면 이 값을 '/'로 바꾼다.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # 정식이다(SPEC 3.1의 `live`). Supabase가 붙었으므로 가짜 백엔드를
          # 내린다 — 레포 하나에 Pages 사이트가 하나뿐이라 `mock`은 여기서
          # 사라진다. "한 곳만 살린다"가 저절로 지켜지는 자리다.
          VITE_AUTH_MODE: live
          # 아래 둘은 **공개해도 되는 값이다.** publishable 키(옛 anon)를 두고
          # Supabase 문서가 "웹페이지·소스코드에 노출해도 안전"하다고 못박았다.
          # 보호는 키를 감추는 것이 아니라 RLS가 한다(SPEC 3.1).
          #
          # 그래서 시크릿이 아니라 여기 그대로 적는다 — 숨겨두면 빠뜨렸을 때
          # 빌드는 지나가고 화면에서만 조용히 안 되는 꼴이 난다.
          #
          # **secret 키(옛 service_role)는 절대 여기 오지 않는다.** RLS를 우회한다.
          VITE_SUPABASE_URL: https://yuognmrpeepkbhphbgwj.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_cw6PwNcOjVCqbhWCI7CCgg_mvgwqDYK
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 이 잡은 **우리 코드를 건드리지 않는다.** 아티팩트를 Pages에 넘기고
      # 게시가 끝나기를 기다릴 뿐이다. 여기서 나는 실패는 코드와 무관하다.
      #
      # `timeout`을 늘리려 하지 말 것 — 액션 안에 10분 상한이 박혀 있어
      # 그보다 큰 값은 조용히 깎인다.
      #
      #     const MAX_TIMEOUT = 600000
      #     this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)
      #
      # 2026-08-06에 20분을 줬다가 그대로 10분에 죽는 것을 보고 알았다. 그날
      # Pages 게시가 31초에서 10분 너머로 느려졌고, 문턱을 넘는 순간부터 계속
      # 실패했다. 기다리는 것 말고 할 수 있는 일이 없다.
      - id: deployment
        uses: actions/deploy-pages@v4
