name: Deploy

# main에 푸시되면 빌드하고, GitHub Pages로 배포한다.
# 수동 실행(workflow_dispatch)도 열어둔다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포에 필요한 최소 권한만.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다(중간에 끊긴 배포가
# 사이트를 깨진 상태로 남기지 않도록).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # 프로젝트 사이트는 https://<user>.github.io/<repo>/ 아래에 놓이므로
        # base 경로를 레포명으로 맞춰야 에셋 링크가 깨지지 않는다.
        # 루트 도메인이나 자가호스팅으로 옮기면 이 값을 '/'로 바꾼다.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # 로그인 게이트는 켜되 백엔드는 가짜다(SPEC 3.1의 `mock`).
          # 서버가 아직 없으므로 배포된 페이지에서 로그인 흐름만 만져볼 수 있다.
          # 이 값을 지우거나 오타를 내면 `live`가 되어 로그인은 요구하되 아무도
          # 못 들어오는 상태가 된다 — 조용히 열리는 것보다 낫다.
          VITE_AUTH_MODE: mock
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 이 잡은 **우리 코드를 건드리지 않는다.** 아티팩트를 Pages에 넘기고
      # 게시가 끝나기를 기다릴 뿐이다. 여기서 나는 실패는 코드와 무관하다.
      #
      # `timeout`을 늘리려 하지 말 것 — 액션 안에 10분 상한이 박혀 있어
      # 그보다 큰 값은 조용히 깎인다.
      #
      #     const MAX_TIMEOUT = 600000
      #     this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)
      #
      # 2026-08-06에 20분을 줬다가 그대로 10분에 죽는 것을 보고 알았다. 그날
      # Pages 게시가 31초에서 10분 너머로 느려졌고, 문턱을 넘는 순간부터 계속
      # 실패했다. 기다리는 것 말고 할 수 있는 일이 없다.
      - id: deployment
        uses: actions/deploy-pages@v4
