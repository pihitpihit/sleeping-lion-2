name: Deploy

# main에 푸시되면 빌드하고, GitHub Pages로 배포한다.
# 수동 실행(workflow_dispatch)도 열어둔다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포에 필요한 최소 권한만.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다(중간에 끊긴 배포가
# 사이트를 깨진 상태로 남기지 않도록).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # 프로젝트 사이트는 https://<user>.github.io/<repo>/ 아래에 놓이므로
        # base 경로를 레포명으로 맞춰야 에셋 링크가 깨지지 않는다.
        # 루트 도메인이나 자가호스팅으로 옮기면 이 값을 '/'로 바꾼다.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # 로그인 게이트는 켜되 백엔드는 가짜다(SPEC 3.1의 `mock`).
          # 서버가 아직 없으므로 배포된 페이지에서 로그인 흐름만 만져볼 수 있다.
          # 이 값을 지우거나 오타를 내면 `live`가 되어 로그인은 요구하되 아무도
          # 못 들어오는 상태가 된다 — 조용히 열리는 것보다 낫다.
          VITE_AUTH_MODE: mock
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
