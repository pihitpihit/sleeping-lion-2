name: Keepalive

# ============================================================================
# Supabase 무료 등급을 깨워둔다.
# ----------------------------------------------------------------------------
# 약 1주일 쓰지 않으면 프로젝트가 잠든다. 판이 뜸한 사이에 잠들면 **다음 판의
# 첫 로그인이 실패한다** — 하필 사람들이 모여 앉은 순간이다.
#
# 예약 작업은 서버가 아니므로 SPEC 4.2의 정책("우리가 돌볼 서버를 두지 않는다")을
# 어기지 않는다. GitHub Actions는 이미 배포에 쓰고 있어 새로 돌볼 것은 이 파일
# 하나뿐이고, 파티 넷이 쓰는 도구에 유료 등급 월 $25는 과하다.
# ============================================================================

on:
  schedule:
    # 하루 두 번.
    #
    # ┌────────────────────────────────────────────────────────────────────┐
    # │ **한 번 찔러 200이 오는 것과 「살아 있는 프로젝트」는 다르다.**     │
    # └────────────────────────────────────────────────────────────────────┘
    #
    # 2026-09-04에 잠들었다 — 사흘 전(09-01) 예약이 200을 받고 성공했는데도
    # 그랬다. Supabase 문서가 적는 기준은 「이레 동안 요청이 하나도 없으면」이
    # 아니라 **"a few user requests to the database each day over the previous
    # week"** — *날마다 몇 번*이다. 사흘에 한 번, 그것도 한 요청은 그 밑이었다.
    #
    # 그래서 **날마다 돌고 한 번에 여러 번 찌른다.** 6초짜리 무료 작업이라
    # 자주 도는 값이 거의 들지 않고, 잠들어서 판을 벌이는 순간에 로그인이
    # 막히는 쪽이 훨씬 비싸다.
    #
    # 두 번으로 나누는 것은 예약이 걸러지는 것에 대비한 것이다 — GitHub은
    # 예약 실행을 best-effort로 두어 바쁠 때 늦거나 거른다. 하루 한 번이면
    # 걸러진 날은 통째로 빈다.
    #
    # :17 — 정각을 피한다. 전 세계 워크플로가 정각에 몰려 그때가 가장 잘 밀린다.
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'
  # 손으로도 돌릴 수 있게 둔다. 잠든 것 같을 때 기다리지 않고 깨우는 길이다.
  workflow_dispatch:

# 빈 커밋을 밀어야 하므로 쓰기가 필요하다. 그 밖에는 아무 권한도 주지 않는다.
permissions:
  contents: write

# 겹쳐 도는 것을 막는다. 늦은 실행과 다음 실행이 만나도 하나만 남는다.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # 닿지 않으면 오래 매달리지 않는다. 조용히 죽는 것이 이 부품의 유일한
    # 실패 방식이라, 빨리 실패해서 알림이 가는 편이 낫다.
    timeout-minutes: 5
    steps:
      - name: Supabase 찌르기
        env:
          # **공개해도 되는 값이다.** publishable 키(옛 anon)를 두고 Supabase
          # 문서가 "웹페이지·소스코드·GitHub Actions에 노출해도 안전"하다고
          # 못박았다. 보호는 키를 감추는 것이 아니라 RLS가 한다.
          #
          # secret 키(옛 service_role)는 여기 오지 않는다. 깨우는 데 필요하지도
          # 않고, RLS를 우회한다.
          SUPABASE_URL: https://yuognmrpeepkbhphbgwj.supabase.co
          SUPABASE_KEY: sb_publishable_cw6PwNcOjVCqbhWCI7CCgg_mvgwqDYK
        run: |
          set -euo pipefail

          # 가장 싼 질의로 찌른다. **무엇을 읽으려는 것이 아니다** — RLS에 걸려
          # 빈 배열이 와도 상관없고, 요청이 Postgres까지 닿았다는 사실이 전부다.
          # 그래서 `limit=1`이고 고르는 칸도 하나다.
          #
          # **여러 번 찌른다.** 문서가 말하는 기준이 「날마다 몇 번」이라 한
          # 번으로는 모자란다(2026-09-04에 그래서 잠들었다). 표를 갈라 찌르는
          # 것은 한 표만 유난히 조용한 것으로 세어지는 일이 없게 하려는 것이다.
          fail=0
          for path in \
            'profiles?select=id&limit=1' \
            'parties?select=id&limit=1' \
            'shop_items?select=id&limit=1'
          do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              "$SUPABASE_URL/rest/v1/$path")

            echo "HTTP $code  $path"
            head -c 200 /tmp/body || true
            echo

            # 200이 아니면 **실패로 남긴다.** 조용히 지나가면 몇 달 뒤 판을
            # 벌이려는 순간에야 잠든 것을 안다.
            if [ "$code" != "200" ]; then fail=1; fi

            sleep 2
          done

          if [ "$fail" != "0" ]; then
            echo "::error::Supabase가 200을 주지 않았다. 프로젝트가 잠들었거나 키가 바뀌었을 수 있다 — 대시보드에서 Resume project."
            exit 1
          fi

      # ----------------------------------------------------------------------
      # 60일 함정 — 스스로 커밋을 밀어 시계를 되감는다
      # ----------------------------------------------------------------------
      # **GitHub은 레포에 60일간 커밋이 없으면 예약 워크플로를 스스로 끈다.**
      # 판이 뜸한 기간은 대개 레포도 조용한 기간이므로, 깨우려고 둔 것이 같은
      # 이유로 먼저 잠든다.
      #
      # **활동으로 쳐지는 것은 커밋뿐이다.** 태그·릴리스·API 호출은 세지 않는다.
      # 그래서 조용해지면 빈 커밋을 하나 민다.
      #
      # 이 커밋은 **다른 워크플로를 깨우지 않는다.** GITHUB_TOKEN으로 민 것은
      # 워크플로를 촉발하지 않는다는 GitHub의 규칙 덕이다 — 덕분에 배포가 괜히
      # 다시 돌지 않는다.
      #
      # 45일에서 움직인다. 60일에 바짝 붙이면 그 한 번이 걸러졌을 때 끝이다.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 조용하면 빈 커밋을 하나 민다
        run: |
          set -euo pipefail

          last=$(git log -1 --format=%ct)
          days=$(( ( $(date -u +%s) - last ) / 86400 ))
          echo "마지막 커밋: $days일 전"

          if [ "$days" -lt 45 ]; then
            echo "아직 조용하지 않다. 그냥 둔다."
            exit 0
          fi

          echo "::warning::커밋이 없은 지 ${days}일이라 빈 커밋을 하나 민다 — 60일이 되면 GitHub이 이 예약을 스스로 끈다."
          git config user.name 'sleeping-lion keepalive'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "chore: 예약이 꺼지지 않게 시계를 되감는다

          GitHub은 레포에 60일간 커밋이 없으면 예약 워크플로를 스스로 끈다.
          Keepalive가 ${days}일째 조용한 것을 보고 스스로 민 빈 커밋이다."
          git push
