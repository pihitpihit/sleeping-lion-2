<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      파비콘 — **작은 자리는 사자 얼굴만 쓴다.**

      간판 원반을 그대로 줄이면 16px에서 글자와 룬이 뭉개져 갈색 얼룩이 된다.
      실제로 줄여 보고 알았다. 그래서 잠든 사자의 얼굴만 오려 금테를 둘렀다 —
      32px에서 감은 눈과 주둥이가 살아 있고, 16px에서도 금테 덕에 다른 탭과
      갈린다.

      **48까지 준다.** 브라우저가 알아서 고르는데, 없는 크기를 만들 때 줄이는
      쪽보다 키우는 쪽이 더 뭉갠다. 큰 자리(홈화면·설치 아이콘)에서는 원반이
      통째로 읽히므로 매니페스트 쪽에 통짜를 둔다.

      벡터 파비콘은 두지 않는다. 원본이 래스터 그림이라 SVG로 옮길 것이 없고,
      SVG를 함께 걸어 두면 브라우저가 그쪽을 먼저 골라 옛 그림이 뜬다.
    -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <!--
      iOS 홈화면 아이콘.

      **아이폰은 홈화면 아이콘으로 SVG를 쓰지 않는다.** 이것이 없으면 화면을
      캡처하거나 제목의 첫 글자('잠')로 대신 그린다 — 실제로 그렇게 났다.
      PNG 하나가 있어야 하고 180×180이 요즘 기기의 기준이다.

      모서리는 **각지게** 둔다. iOS가 제 마스크로 둥글리므로 둥근 것을 넣으면
      귀퉁이가 두 번 깎여 파인다.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 안드로이드·데스크톱은 매니페스트에서 아이콘을 읽는다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover: 아이폰 노치/다이나믹 아일랜드 영역까지 배경을 채우고,
         내용은 CSS의 env(safe-area-inset-*)로 밀어낸다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12100d" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="잠자는 사자 2호점 — 글룸헤이븐과 사자의 턱에 쓰는 일지와 행낭"
    />
    <!-- iOS 홈화면 추가 시 전체화면 웹앱으로 동작 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="잠자는 사자 2호점" />
    <title>잠자는 사자 2호점 · Sleeping Lion II</title>
  </head>
  <body>
    <!--
      ┌──────────────────────────────────────────────────────────────────────┐
      │ **낡은 껍데기가 없어진 조각을 부르면 아무것도 안 돈다.**              │
      └──────────────────────────────────────────────────────────────────────┘

      배포할 때마다 조각 이름에 내용 해시가 붙고 옛 파일은 사라진다. 홈화면
      아이콘으로 앱을 켜 둔 채 배포가 몇 번 나가면, 손에 든 `index.html`이
      **이미 없는 이름을 부른다** — 진입 조각이 404면 React가 아예 안 뜨므로
      `RouteBoundary`도 `lazyPage`의 재시도도 닿지 못한다. 남는 것은 **까만
      화면뿐**이고, 그것은 고장이 아니라 고장을 숨긴 것이다(구현 결정 258).

      그래서 그물을 여기, 껍데기 안에 친다. 여기 있는 것은 조각이 하나도 안
      실려도 도는 것이라야 하므로 **스타일을 인라인으로 적는다** — 스타일시트도
      함께 404이기 때문이다.
    -->
    <div id="root">
      <div id="boot" style="display: none">
        <div
          style="
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: system-ui, sans-serif;
            line-height: 1.7;
            color: #cbbfa8;
            background: #12100d;
            text-align: center;
          "
        >
          <div>
            <p style="margin: 0 0 0.6rem; color: #e8cd72">앱을 불러오지 못했다</p>
            <p style="margin: 0; font-size: 0.9rem">
              화면을 아래로 당겨 새로고침하거나, 앱을 닫았다 다시 연다.
            </p>
          </div>
        </div>
      </div>
    </div>
    <script>
      /*
        **앱이 떴는지 지켜본다.** `main.tsx`가 뜨면서 표를 남기므로, 몇 초가 지나
        표가 없으면 껍데기가 낡은 것이다.

        한 번만 스스로 새로 부른다 — 새로 부르면 브라우저가 `index.html`을 다시
        받아 오므로 대개 그것으로 풀린다. **두 번 잇달아 하지 않는다**: 조각이
        진짜로 없어진 것이라면 새로 불러도 같은 자리에서 터지고, 무한 되불러오기가
        가장 나쁘다(`staleChunk.ts`와 같은 판단).
      */
      ;(function () {
        var KEY = 'sl2:boot-reload'
        var GAP = 20000
        var WAIT = 6000
        window.__sl2Booted = false
        setTimeout(function () {
          if (window.__sl2Booted) return
          var last = 0
          try {
            last = Number(sessionStorage.getItem(KEY) || 0)
          } catch (e) {
            last = 0
          }
          var now = Date.now()
          if (now - last > GAP) {
            try {
              sessionStorage.setItem(KEY, String(now))
            } catch (e) {
              /* 사생활 보호 모드 — 그래도 한 번은 해 본다. */
            }
            location.reload()
            return
          }
          var boot = document.getElementById('boot')
          if (boot) boot.style.display = 'block'
        }, WAIT)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
